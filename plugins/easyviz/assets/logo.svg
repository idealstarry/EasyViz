  <title id="title">EasyViz — chromatic landscape</title>
  <desc id="desc">A borderless superellipse with a blue, cyan and violet dawn sky, an amber sun, layered jade hills, and a pale plotted curve with three observation nodes. Pure editable vector geometry; transparent outside the silhouette.</desc>
