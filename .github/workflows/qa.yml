name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install declared development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install optional MCP dependencies for interoperability tests
        run: python -m pip install -r skills/easyviz/scripts/requirements-mcp.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test data, statistics, geometry and export contracts
        run: python -m unittest discover -s tests -p 'test_*.py' --failfast
      - name: Build the portable plugin
        run: python scripts/build_plugin.py
      - name: Verify ZIP resources and extracted core runtime
        run: python scripts/check_package.py
      - name: Verify npm CLI and the actual installed package
        run: |
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"
          python scripts/check_npm_package.py "$RUNNER_TEMP/idealstarry-easyviz-$(node bin/easyviz.mjs --version).tgz"
