name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test data, statistics, geometry and export contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build the portable plugin
        run: python scripts/build_plugin.py
      - name: Verify ZIP resources and extracted core runtime
        run: python scripts/check_package.py
